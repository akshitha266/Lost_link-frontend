<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – LostLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="container container-narrow" style="max-width: 480px;">
      <div class="card" style="box-shadow: var(--shadow-lg);">
        <div class="card-header" style="text-align: center; display: block; padding-bottom: 0.75rem;">
          <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 44px; height: 44px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </div>
          <h2>Welcome Back</h2>
          <p style="font-size: 0.9rem; margin-top: 0.25rem;">Sign in to your LostLink college account</p>
        </div>

        <div class="card-body">
          <!-- Alert Area -->
          <div id="loginErrorAlert" class="notice-box notice-warning" style="display: none; color: #991b1b; background: #fee2e2; border-color: #fca5a5;"></div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="loginEmail">College Email Address <span class="required">*</span></label>
              <input type="email" class="form-control" id="loginEmail" name="email" placeholder="e.g., student@college.edu" autocomplete="email" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" for="loginPassword">Password <span class="required">*</span></label>
              </div>
              <input type="password" class="form-control" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required>
              <div class="invalid-feedback">Password is required (min 6 characters).</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.75rem;">
              Sign In
            </button>
          </form>

          <!-- Quick Demo Credential Autofill (Helpful for demonstration/evaluation) -->
          <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color); text-align: center;">
            <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">
              Demo Quick-Fill
            </span>
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
              <button type="button" class="btn btn-secondary btn-sm" id="fillDemoUser">Student Demo</button>
              <button type="button" class="btn btn-secondary btn-sm" id="fillDemoAdmin">Admin Demo</button>
            </div>
          </div>
        </div>

        <div class="card-footer" style="text-align: center; font-size: 0.9rem;">
          Don't have an account yet? <a href="register.html" style="font-weight: 600;">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
