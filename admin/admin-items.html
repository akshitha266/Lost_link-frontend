<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Listings – LostLink Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
            <a href="admin-dashboard.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Admin Overview</a>
          </div>
          <h1 style="font-size: 2rem;">Item Listings Moderation</h1>
          <p>Audit and moderate public items. Inappropriate or duplicate posts can be removed immediately.</p>
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <select class="form-select" id="adminItemType" style="width: 140px;">
            <option value="ALL">All Types</option>
            <option value="LOST">Lost</option>
            <option value="FOUND">Found</option>
          </select>
          <input type="text" class="form-control" id="adminItemSearch" placeholder="Filter title or location..." style="width: 220px;">
        </div>
      </div>

      <!-- Moderation Table -->
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Item Title & Category</th>
              <th>Type</th>
              <th>Date</th>
              <th>Campus Location</th>
              <th>Status</th>
              <th style="text-align: right;">Moderation</th>
            </tr>
          </thead>
          <tbody id="adminItemsTableBody">
            <tr>
              <td colspan="7" style="text-align: center;"><div class="spinner"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/api.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
