<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users – LostLink Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
            <a href="admin-dashboard.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Admin Overview</a>
          </div>
          <h1 style="font-size: 2rem;">User Directory & Permissions</h1>
          <p>Search, review, and manage active status of registered college community members.</p>
        </div>

        <div style="width: 280px;">
          <input type="text" class="form-control" id="adminUserSearch" placeholder="Search by name or email...">
        </div>
      </div>

      <!-- Users Table -->
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>College Email</th>
              <th>Role</th>
              <th>Account Status</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="adminUsersTableBody">
            <tr>
              <td colspan="6" style="text-align: center;"><div class="spinner"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/api.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
